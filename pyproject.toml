[project]
name = "sellma-drift"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lingua-language-detector>=2.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "torch==2.5.1",
    "transformers==4.46.3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "markdown>=3.11.3",
    "weasyprint>=70.0",
]
